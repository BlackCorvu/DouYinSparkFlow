name: DouYin Spark Flow Schedule Run
on:
  workflow_dispatch: # 允许手动触发
  # [2026-09-18] 停用定时：抖音风控会踢掉 GitHub Actions 出口 IP 的会话（上游 issue #80），
  # 定时跑必然失败。恢复定时需换国内/住宅 IP 环境运行并更新 cookies；
  # 注意同一份 cookies 不要在两个 IP 环境同时使用，会互相顶下线。
  # schedule: # 定时任务
  #   - cron: "0 6 * * *" # 每天 06:00 UTC（对应北京时间 14:00）
jobs:
  run-main:
    timeout-minutes: 240
    runs-on: ubuntu-latest
    environment: user-data
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Test Douyin Accessibility
      run: |
        curl -I https://creator.douyin.com/
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Ensure browsers are installed
      run: playwright install chromium --with-deps --only-shell
    - name: Export Github Environment Variables and Secrets to JSON
      env:
        VARS_JSON: ${{ toJson(vars) }}
        SECRETS_JSON: ${{ toJson(secrets) }}
      run: python utils/export_github_env.py
    - name: Run DouYin Spark Flow
      run: python main.py
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: run-logs
        path: logs/
  workflow-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1